name: Validate package pull request

on:
  pull_request:
    paths:
      - "app-store-server/apps/**"
      - "app-store-server/themes/**"
      - "app-store-server/watchfaces/**"
      - "sdk/**"
      - "app-store-server/scripts/**"
      - "app-store-server/public/v1/catalog.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm --prefix app-store-server run check:source
      - id: packages
        run: node app-store-server/scripts/list-apps.mjs >> "$GITHUB_OUTPUT"

  build:
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect ${{ matrix.id }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: ${{ matrix.path }}
          command: >-
            idf.py so &&
            python ../../scripts/verify-elf-imports.py
            build/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.id }}
          path: ${{ matrix.path }}/build/${{ matrix.artifact }}
          if-no-files-found: error
