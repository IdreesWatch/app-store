name: Build apps and deploy store

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.apps.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm --prefix app-store-server run check:source
      - id: apps
        run: node app-store-server/scripts/list-apps.mjs >> "$GITHUB_OUTPUT"

  build:
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect ${{ matrix.id }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: ${{ matrix.path }}
          command: >-
            idf.py so &&
            python ../../scripts/verify-elf-imports.py
            build/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.id }}
          path: ${{ matrix.path }}/build/${{ matrix.artifact }}
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Stage built package and catalog
        run: node app-store-server/scripts/publish-all-apps.mjs artifacts
      - run: npm --prefix app-store-server run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app-store-server/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
